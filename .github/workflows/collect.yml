# EIASS 공람 자료를 매일 모아서 커밋하고, 사이트를 다시 배포한다.
#
# ── 2026-08-09: 서울 중계를 도입했다 (WARP 는 걷어냈다) ─────────────
# GitHub 러너(미국 Azure)에서 EIASS 접속은 **6번 중 1번**만 됐다.
# 차단은 아니다 — 전 세계 20곳 중 17곳에서 정상이고, 같은 러너에서
# VWorld(한국)는 0.43초에 붙는데 EIASS 만 시간 초과했다. EIASS 쪽 문제다.
#
# 해결: **EIASS 로 가는 요청만** 서울에 둔 중계를 거치게 했다.
#   중계 함수 원본 = tools/relay/index.ts (Supabase Edge Function, 서울 리전)
#   2026-08-09 실측 — 서울에서 13번 호출 13번 성공, 7.4MB PDF 도 바이트 단위로 동일.
#   목록 조회 평균 121ms. (GitHub 직접 접속은 17%)
#
# ★ WARP 터널 방식은 지웠다. 8/7~8/8 자동 수집 3회 모두 같은 자리에서 죽었고,
#   그때 **VWorld 까지 같이 실패**했다(8/6 에는 0.43초에 붙던 것). WARP 설치가
#   러너 네트워크를 망가뜨린 것으로 보인다. 되살리지 말 것. (docs/HISTORY.md §4)
#
# 중계 주소·키가 없으면 build_data.py 는 예전처럼 직접 접속한다(그러면 또 실패할 뿐,
# 자료는 안 망가진다). 한국 PC 의 run_daily.bat 은 중계를 안 쓰고 직접 간다.

name: EIASS 공람 자료 수집

on:
  schedule:
    # 한국 오전 7시. (cron 은 UTC 기준이라 22시로 적는다. 22 + 9 = 31 -> 다음 날 7시)
    # 담당자가 출근해서 보기 전에 자료가 준비돼 있도록 이 시간으로 잡았다.
    - cron: "0 22 * * *"
    # 한국 오후 1시 — 아침 실행이 접속 불안정으로 실패했을 때를 위한 두 번째 기회.
    # 아침에 성공했으면 이미 받아 둔 사업은 건너뛰므로 비용도 시간도 거의 안 든다.
    - cron: "0 4 * * *"
    # 한국 0시 10분 — **공람이 끝난 사업의 AI 해석을 파일에서 지우기 위한 실행이다.**
    # 공람은 자정에 끝나는데 다음 수집이 7시라면, 그 7시간 동안 공개 파일
    # (data/projects.json)에 해석이 남는다. 화면은 이미 가리지만 파일은 그대로 읽힌다.
    # 새 사업이 없으면 비용은 사실상 0원이다(이미 받아 둔 사업은 건너뛴다).
    - cron: "10 15 * * *"

  workflow_dispatch:
    inputs:
      full:
        description: "이미 받아 둔 것을 무시하고 전부 다시 받기 (비용이 많이 든다)"
        type: boolean
        default: false
      limit:
        description: "유형별 최대 건수 (시험용). 넣으면 커밋하지 않는다."
        type: string
        default: ""

# 결과 파일을 커밋해야 하므로 쓰기 권한이 필요하다.
# pages/id-token 은 수집이 끝난 뒤 부르는 배포 워크플로에 넘겨주기 위한 것이다.
permissions:
  contents: write
  pages: write
  id-token: write

# 앞 실행이 안 끝났는데 다음 실행이 겹쳐 도는 것을 막는다.
concurrency:
  group: eiass-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      # ── EIASS 로 가는 길 확인 ────────────────────────────────────────
      # 서울 중계가 살아 있는지 먼저 본다. 중계가 죽었으면 수집을 아예 시작하지 않는다
      # (반쪽 수집이 멀쩡한 자료를 덮어쓰는 게 가장 위험하다).
      - name: EIASS 가는 길 확인 (서울 중계)
        env:
          EIASS_RELAY_URL: ${{ secrets.EIASS_RELAY_URL }}
          EIASS_RELAY_KEY: ${{ secrets.EIASS_RELAY_KEY }}
        run: |
          if [ -z "$EIASS_RELAY_URL" ] || [ -z "$EIASS_RELAY_KEY" ]; then
            echo "::error::[통로] EIASS_RELAY_URL / EIASS_RELAY_KEY Secret 이 없습니다. docs/SETUP.md 참고"
            exit 1
          fi
          # 중계를 거쳐 EIASS 목록 첫 쪽을 실제로 받아 본다 (자료는 저장하지 않는다).
          # 요청 형식은 build_data.py 의 fetch_list_page 와 같다.
          FORM='query=&collection=draft&urlString=%26alias%3D1%26orgnCd%3D%26sido%3D&viewName=eiass/user/partcptn/choan/choanSperssList_searchApi&currentPage=1&sort=DRFOP_TMDT_START_DT/DESC,BIZ_SEQ/DESC'
          OUT=$(curl -s -o body.bin -D head.txt -w '%{http_code}' --max-time 90 -X POST "$EIASS_RELAY_URL" -H "x-relay-key: $EIASS_RELAY_KEY" -H "x-relay-url: https://www.eiass.go.kr/searchApi/search.do" -H "x-relay-method: POST" -H "x-region: ap-northeast-2" -H "content-type: application/x-www-form-urlencoded" --data "$FORM")
          # 헤더 줄 끝의 CR(8진수 015)을 떼고 값만 뽑는다
          UP=$(grep -i '^x-upstream-status' head.txt | tr -d '\015' | awk '{print $2}')
          REGION=$(grep -i '^x-sb-edge-region' head.txt | tr -d '\015' | awk '{print $2}')
          SIZE=$(wc -c < body.bin)
          VW=$(curl -s -o /dev/null --max-time 8 https://api.vworld.kr/ && echo OK || echo FAIL)
          echo "중계 ${OUT} / EIASS ${UP} / ${SIZE} bytes / 지역 ${REGION} / VWorld ${VW}"
          # 지역이 서울이 아니면 중계를 거치는 뜻이 없다.
          # 기본값이 '부르는 사람과 가까운 곳'이라, x-region 이 안 먹으면 미국에서 돈다.
          if [ "$OUT" = "200" ] && [ "$UP" = "200" ] && [ "$SIZE" -gt 1000 ] && [ "$REGION" = "ap-northeast-2" ]; then
            echo "::notice::[통로] 서울 중계로 EIASS 연결 성공 (${SIZE} bytes) / VWorld ${VW}"
          else
            head -c 400 body.bin || true
            echo "::error::[통로] 서울 중계 실패 (중계 ${OUT} / EIASS ${UP} / 지역 ${REGION}) — 수집을 시작하지 않고 멈춥니다 (비용 0원, 자료 안전) / VWorld ${VW}"
            exit 1
          fi
          rm -f body.bin head.txt

      # 수집이 부실하게 끝났을 때 멀쩡한 자료를 덮어쓰지 않도록, 먼저 지금 건수를 세어 둔다.
      - name: 수집 전 건수 기록
        id: before
        run: |
          python - <<'PY'
          import json, os
          try:
              with open("data/projects.json", encoding="utf-8") as f:
                  n = len(json.load(f).get("projects", []))
          except Exception:
              n = 0
          print(f"지금 저장된 사업 {n}건")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"count={n}\n")
          PY

      - name: EIASS 수집
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # VWorld 데이터 API 는 발급 때 등록한 서비스 URL 을 같이 보내야 한다.
          VWORLD_DOMAIN: ${{ vars.VWORLD_DOMAIN }}
          # ★ EIASS 요청만 서울 중계를 거친다. VWorld·Anthropic 은 직접 간다.
          #   이 둘이 없으면 build_data.py 는 예전처럼 직접 접속한다(그러면 대개 실패한다).
          EIASS_RELAY_URL: ${{ secrets.EIASS_RELAY_URL }}
          EIASS_RELAY_KEY: ${{ secrets.EIASS_RELAY_KEY }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.full }}" = "true" ]; then ARGS="$ARGS --full"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          echo "실행: python tools/build_data.py $ARGS"

          # EIASS 접속이 간헐적으로 끊긴다. 스크립트 안에서도 4번 재시도하지만,
          # 그걸 다 쓰고 죽는 경우가 있어서 여기서 통째로 한 번 더 시도한다.
          # (1분 쉬었다 다시 하면 그 사이에 접속이 돌아오는 경우가 있다)
          for TRY in 1 2; do
            echo "===== ${TRY}번째 시도 ====="
            if python tools/build_data.py $ARGS 2>&1 | tee /tmp/collect.log; then
              echo "수집 성공 (${TRY}번째 시도)"
              exit 0
            fi
            echo "${TRY}번째 시도 실패"
            if [ "$TRY" = "1" ]; then
              echo "1분 쉬었다가 다시 시도합니다..."
              sleep 60
            fi
          done

          # 두 번 다 실패. 로그 끝부분을 주석으로 남겨 원인을 밖에서도 볼 수 있게 한다.
          TAIL=$(tail -n 25 /tmp/collect.log | tr '\n' '|' | tail -c 2000)
          echo "::error::[수집 실패] 두 번 시도했으나 모두 실패 || ${TAIL}"
          exit 1

      # 수집이 반쪽만 되어도 파일은 만들어진다. 그 상태로 커밋하면
      # 멀쩡하던 자료가 줄어든 채 사이트에 올라간다. 그것을 막는다.
      - name: 결과 확인 (부실하면 커밋하지 않고 멈춤)
        run: |
          python - <<'PY'
          import json, sys
          before = int("${{ steps.before.outputs.count }}" or 0)
          with open("data/projects.json", encoding="utf-8") as f:
              n = len(json.load(f).get("projects", []))
          print(f"수집 전 {before}건 -> 수집 후 {n}건")

          if n == 0:
              print("::error::수집 결과가 0건입니다. 커밋하지 않고 멈춥니다.")
              sys.exit(1)
          # 공람이 끝나 빠지는 사업이 있으므로 조금 줄어드는 것은 정상이다.
          # 다만 절반 아래로 떨어지면 수집이 반쪽만 된 것으로 본다.
          if before >= 10 and n < before * 0.5:
              print(f"::error::{before}건이던 것이 {n}건으로 급감했습니다. "
                    f"수집이 제대로 안 된 것으로 보고 커밋하지 않습니다.")
              sys.exit(1)
          if before >= 10 and n < before * 0.8:
              print(f"::warning::{before}건 -> {n}건으로 꽤 줄었습니다. 확인해 보세요.")
          print("정상 범위입니다.")
          PY

      - name: 바뀐 게 있으면 커밋
        # --limit 를 준 시험 실행은 일부만 수집하므로 절대 커밋하지 않는다.
        # (예전에는 이 장치가 없어서, 시험 삼아 --limit 3 으로 돌리면
        #  48건이던 자료가 6건으로 덮어써진 채 그대로 올라갈 수 있었다)
        if: ${{ inputs.limit == '' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          # 지역별 캘린더(.ics)도 함께 올린다. 이걸 빠뜨리면 주민이 구독한 주소의
          # 내용이 영영 안 바뀌어, 새 사업이 떠도 캘린더에 안 들어온다.
          git add -A data/cal
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
          else
            git commit -m "데이터 갱신 $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: 시험 실행 안내
        if: ${{ inputs.limit != '' }}
        run: echo "::notice::--limit ${{ inputs.limit }} 로 돈 시험 실행이라 커밋하지 않았습니다."

  # 수집이 끝나면 바로 사이트를 다시 올린다.
  # (Actions 가 만든 커밋은 다른 워크플로를 자동으로 깨우지 않기 때문에 여기서 직접 부른다)
  deploy:
    needs: collect
    if: ${{ inputs.limit == '' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
