# ⚠️ 지금은 쓰지 않는다. 자동 실행을 꺼 뒀다.
#
#   EIASS(www.eiass.go.kr)가 해외 IP 를 막고 있어서 GitHub 서버(미국)에서는
#   연결 자체가 안 된다. 2026-08-01 확인:
#       requests.exceptions.ConnectTimeout — connect timeout=20
#       (DNS 는 풀리는데 TCP 연결이 조용히 버려진다 = 거부가 아니라 차단)
#
#   그래서 자료 수집은 한국에 있는 PC 에서 tools/run_daily.bat 로 돌린다.
#   그 스크립트가 수집 후 GitHub 에 올리고, 올리면 deploy.yml 이 사이트를 다시 배포한다.
#   자세한 건 docs/SETUP.md 의 "6단계 — EIASS가 막혔다면".
#
#   이 파일을 지우지 않고 두는 이유: 나중에 EIASS 가 차단을 풀거나,
#   한국에 있는 self-hosted 러너를 붙이면 그대로 다시 쓸 수 있다.
#   다시 켜려면 아래 schedule 주석을 풀면 된다.

name: EIASS 공람 자료 수집 (사용 안 함 — 해외 IP 차단)

on:
  # EIASS 가 GitHub 서버를 막고 있어 매일 실패하므로 자동 실행을 꺼 뒀다.
  # 차단이 풀렸는지 확인하려면 아래 두 줄의 주석을 푼다. (00:00 UTC = 한국 오전 9시)
  #  schedule:
  #    - cron: "0 0 * * *"
  #
  # 손으로 눌러 돌릴 수는 있다. '연결 확인' 단계가 아직도 막혔는지 알려 준다.
  workflow_dispatch:
    inputs:
      full:
        description: "이미 받아 둔 것을 무시하고 전부 다시 받기 (비용이 많이 든다)"
        type: boolean
        default: false
      limit:
        description: "유형별 최대 건수 (비워 두면 전건). 처음 시험할 땐 3 정도로."
        type: string
        default: ""

# 결과 파일을 커밋해야 하므로 쓰기 권한이 필요하다.
# pages/id-token 은 수집이 끝난 뒤 부르는 배포 워크플로에 넘겨주기 위한 것이다.
permissions:
  contents: write
  pages: write
  id-token: write

# 앞 실행이 안 끝났는데 다음 실행이 겹쳐 도는 것을 막는다.
concurrency:
  group: eiass-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 전국 전건이면 오래 걸린다. 무한정 도는 것은 막되 넉넉히 준다.
    timeout-minutes: 120

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      # GitHub 서버(미국)에서 EIASS·VWorld 에 닿는지 먼저 확인한다.
      # 한국 정부 사이트는 해외 IP를 막는 경우가 있어서, 막혔다면 여기서
      # "무엇이 어떻게 막혔는지"를 사람이 읽을 수 있는 말로 알려 준다.
      - name: 연결 확인
        run: |
          python - <<'PY'
          import socket, ssl, sys
          import requests

          def check(name, fn):
              print(f"\n── {name}")
              try:
                  fn()
              except requests.exceptions.SSLError as e:
                  print(f"   [실패] SSL 인증서 문제: {e}")
                  return "ssl"
              except requests.exceptions.ConnectTimeout:
                  print("   [실패] 연결 시간 초과 — 요청이 조용히 버려졌습니다.")
                  print("          해외 IP 차단일 가능성이 큽니다.")
                  return "timeout"
              except requests.exceptions.ConnectionError as e:
                  print(f"   [실패] 연결 자체가 안 됩니다: {e}")
                  return "conn"
              except Exception as e:
                  print(f"   [실패] {type(e).__name__}: {e}")
                  return "other"
              return None

          problems = []

          def eiass():
              ip = socket.gethostbyname("www.eiass.go.kr")
              print(f"   DNS 조회 성공: www.eiass.go.kr -> {ip}")
              r = requests.post(
                  "https://www.eiass.go.kr/searchApi/search.do",
                  data={"query": "", "collection": "draft",
                        "urlString": "&alias=1&orgnCd=&sido=",
                        "viewName": "eiass/user/partcptn/choan/choanSperssList_searchApi",
                        "currentPage": 1},
                  headers={"User-Agent": "Mozilla/5.0"}, timeout=20)
              print(f"   HTTP {r.status_code}, 응답 {len(r.content):,}바이트")
              if r.status_code == 403:
                  print("   [실패] 403 — 서버가 이 접속을 거부했습니다(해외 IP 차단 가능성).")
                  problems.append("eiass-403")
              elif r.status_code != 200:
                  print(f"   [실패] 예상치 못한 상태코드 {r.status_code}")
                  problems.append("eiass-status")
              elif "tbl01" not in r.text:
                  print("   [경고] 응답은 왔는데 목록 표가 없습니다. 화면이 바뀌었을 수 있습니다.")
                  print("   응답 앞부분:", r.text[:300].replace("\n", " "))
                  problems.append("eiass-shape")
              else:
                  print("   [정상] 목록을 받아왔습니다.")

          def vworld():
              r = requests.get("https://api.vworld.kr/req/address",
                               params={"service": "address", "request": "getcoord",
                                       "version": "2.0", "crs": "epsg:4326",
                                       "address": "서울특별시 중구 세종대로 110",
                                       "type": "road", "key": "TEST"}, timeout=20)
              print(f"   HTTP {r.status_code} — 응답이 오면 연결은 되는 것입니다.")

          for name, fn in [("EIASS 목록 API", eiass), ("VWorld", vworld)]:
              why = check(name, fn)
              if why:
                  problems.append(f"{name}:{why}")

          if problems:
              print("\n" + "=" * 60)
              print("연결 확인 실패:", ", ".join(problems))
              print("EIASS 쪽이 막혔다면 GitHub 에서 자동 수집은 할 수 없습니다.")
              print("docs/SETUP.md 의 '6단계 — EIASS가 막혔다면' 을 보세요.")
              print("=" * 60)
              sys.exit(1)
          print("\n연결 확인 통과.")
          PY

      - name: EIASS 수집
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # VWorld 데이터 API 는 발급 때 등록한 서비스 URL 을 같이 보내야 한다.
          VWORLD_DOMAIN: ${{ vars.VWORLD_DOMAIN }}
        run: |
          ARGS=""
          if [ "${{ inputs.full }}" = "true" ]; then ARGS="$ARGS --full"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          echo "실행: python tools/build_data.py $ARGS"
          python tools/build_data.py $ARGS

      - name: 결과 확인
        # 수집이 실패해 빈 파일이 커밋되는 것을 막는다.
        run: |
          python - <<'PY'
          import json, sys
          with open("data/projects.json", encoding="utf-8") as f:
              data = json.load(f)
          n = len(data.get("projects", []))
          print(f"공람 중인 사업 {n}건")
          if n == 0:
              print("::error::수집 결과가 0건입니다. 커밋하지 않고 멈춥니다.")
              sys.exit(1)
          PY

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
          else
            git commit -m "데이터 갱신 $(date -u +'%Y-%m-%d')"
            git push
          fi

  # 수집이 끝나면 바로 사이트를 다시 올린다.
  # (Actions 가 만든 커밋은 다른 워크플로를 자동으로 깨우지 않기 때문에 여기서 직접 부른다)
  deploy:
    needs: collect
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
