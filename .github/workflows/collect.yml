# EIASS 공람 자료를 매일 모아서 커밋하고, 사이트를 다시 배포한다.
#
# ── 2026-08-06: 자동 실행을 켰다 ───────────────────────────────────
# 예전에는 "EIASS 가 해외 IP 를 막아서 GitHub 에서는 불가능" 이라고 적고
# 자동 실행을 꺼 뒀는데, 다시 확인해 보니 **사실이 아니었다.**
#
#   - 전 세계 20개 노드 중 17곳에서 EIASS 정상 응답
#     (미국 LA 0.49초, 댈러스 1.09초, 독일·프랑스·네덜란드·러시아·인도·베트남)
#   - GitHub 러너(미국 Azure)에서도 EIASS 0.23초, VWorld 0.22초로 정상 접속
#   - 그 결론은 2026-08-01 에 **딱 한 번** 실행해 실패한 것을 근거로 내려졌고,
#     원인을 밝히려고 만든 '연결 확인' 단계는 그때 존재하지도 않았다.
#
# 다만 **접속이 간헐적으로 불안정한 것은 사실이다.** 3번 시험에 1번 성공했다.
#     1차 52.159.244.171  DNS 조회 실패 (10초)
#     2차 9.234.149.180   DNS 는 됐는데 TCP 443 이 20초 무응답
#     3차 20.161.78.74    전부 정상 (0.23초)
# 2·3차는 같은 데이터센터인데 결과가 달랐다 = 차단이 아니라 불안정.
#
# 그래서 build_data.py 안에 재시도 장치를 넣었다(SESSION).
# 연결이 안 되면 4초·8초·16초 쉬면서 최대 4번까지 스스로 다시 시도한다.
# 그래도 실패하면 그날 자료가 안 바뀔 뿐이고, 화면은 어제 자료로 정상 동작한다.
# (워크플로가 실패하면 GitHub 이 저장소 주인에게 메일을 보낸다)

name: EIASS 공람 자료 수집

on:
  schedule:
    # 한국 오전 7시. (cron 은 UTC 기준이라 22시로 적는다. 22 + 9 = 31 -> 다음 날 7시)
    # 담당자가 출근해서 보기 전에 자료가 준비돼 있도록 이 시간으로 잡았다.
    - cron: "0 22 * * *"
    # 한국 오후 1시 — 아침 실행이 접속 불안정으로 실패했을 때를 위한 두 번째 기회.
    # 아침에 성공했으면 이미 받아 둔 사업은 건너뛰므로 비용도 시간도 거의 안 든다.
    - cron: "0 4 * * *"

  workflow_dispatch:
    inputs:
      full:
        description: "이미 받아 둔 것을 무시하고 전부 다시 받기 (비용이 많이 든다)"
        type: boolean
        default: false
      limit:
        description: "유형별 최대 건수 (시험용). 넣으면 커밋하지 않는다."
        type: string
        default: ""

# 결과 파일을 커밋해야 하므로 쓰기 권한이 필요하다.
# pages/id-token 은 수집이 끝난 뒤 부르는 배포 워크플로에 넘겨주기 위한 것이다.
permissions:
  contents: write
  pages: write
  id-token: write

# 앞 실행이 안 끝났는데 다음 실행이 겹쳐 도는 것을 막는다.
concurrency:
  group: eiass-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      # 참고용이다. 여기서 실패해도 멈추지 않는다 —
      # 수집 스크립트가 스스로 재시도하므로, 이 순간 한 번 안 됐다고 포기할 이유가 없다.
      - name: 연결 확인 (참고용, 실패해도 계속)
        continue-on-error: true
        run: |
          python - <<'PY'
          import socket, time
          out = []
          for label, host in [("EIASS", "www.eiass.go.kr"), ("VWorld", "api.vworld.kr")]:
              t = time.time()
              try:
                  ip = socket.gethostbyname(host)
                  s = socket.create_connection((ip, 443), timeout=10)
                  s.close()
                  line = f"{label} 성공 {ip} ({time.time()-t:.2f}초)"
              except Exception as e:
                  line = f"{label} 실패 {type(e).__name__} ({time.time()-t:.1f}초)"
              print("  " + line)
              out.append(line)
          # 로그 본문은 저장소 주인만 볼 수 있어서, 도와주는 사람이 읽을 수 있게 주석으로도 남긴다.
          print("::notice::[연결확인] " + " || ".join(out))
          PY

      # 수집이 부실하게 끝났을 때 멀쩡한 자료를 덮어쓰지 않도록, 먼저 지금 건수를 세어 둔다.
      - name: 수집 전 건수 기록
        id: before
        run: |
          python - <<'PY'
          import json, os
          try:
              with open("data/projects.json", encoding="utf-8") as f:
                  n = len(json.load(f).get("projects", []))
          except Exception:
              n = 0
          print(f"지금 저장된 사업 {n}건")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"count={n}\n")
          PY

      - name: EIASS 수집
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # VWorld 데이터 API 는 발급 때 등록한 서비스 URL 을 같이 보내야 한다.
          VWORLD_DOMAIN: ${{ vars.VWORLD_DOMAIN }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.full }}" = "true" ]; then ARGS="$ARGS --full"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          echo "실행: python tools/build_data.py $ARGS"

          # EIASS 접속이 간헐적으로 끊긴다. 스크립트 안에서도 4번 재시도하지만,
          # 그걸 다 쓰고 죽는 경우가 있어서 여기서 통째로 한 번 더 시도한다.
          # (1분 쉬었다 다시 하면 그 사이에 접속이 돌아오는 경우가 있다)
          for TRY in 1 2; do
            echo "===== ${TRY}번째 시도 ====="
            if python tools/build_data.py $ARGS 2>&1 | tee /tmp/collect.log; then
              echo "수집 성공 (${TRY}번째 시도)"
              exit 0
            fi
            echo "${TRY}번째 시도 실패"
            if [ "$TRY" = "1" ]; then
              echo "1분 쉬었다가 다시 시도합니다..."
              sleep 60
            fi
          done

          # 두 번 다 실패. 로그 끝부분을 주석으로 남겨 원인을 밖에서도 볼 수 있게 한다.
          TAIL=$(tail -n 25 /tmp/collect.log | tr '\n' '|' | tail -c 2000)
          echo "::error::[수집 실패] 두 번 시도했으나 모두 실패 || ${TAIL}"
          exit 1

      # 수집이 반쪽만 되어도 파일은 만들어진다. 그 상태로 커밋하면
      # 멀쩡하던 자료가 줄어든 채 사이트에 올라간다. 그것을 막는다.
      - name: 결과 확인 (부실하면 커밋하지 않고 멈춤)
        run: |
          python - <<'PY'
          import json, sys
          before = int("${{ steps.before.outputs.count }}" or 0)
          with open("data/projects.json", encoding="utf-8") as f:
              n = len(json.load(f).get("projects", []))
          print(f"수집 전 {before}건 -> 수집 후 {n}건")

          if n == 0:
              print("::error::수집 결과가 0건입니다. 커밋하지 않고 멈춥니다.")
              sys.exit(1)
          # 공람이 끝나 빠지는 사업이 있으므로 조금 줄어드는 것은 정상이다.
          # 다만 절반 아래로 떨어지면 수집이 반쪽만 된 것으로 본다.
          if before >= 10 and n < before * 0.5:
              print(f"::error::{before}건이던 것이 {n}건으로 급감했습니다. "
                    f"수집이 제대로 안 된 것으로 보고 커밋하지 않습니다.")
              sys.exit(1)
          if before >= 10 and n < before * 0.8:
              print(f"::warning::{before}건 -> {n}건으로 꽤 줄었습니다. 확인해 보세요.")
          print("정상 범위입니다.")
          PY

      - name: 바뀐 게 있으면 커밋
        # --limit 를 준 시험 실행은 일부만 수집하므로 절대 커밋하지 않는다.
        # (예전에는 이 장치가 없어서, 시험 삼아 --limit 3 으로 돌리면
        #  48건이던 자료가 6건으로 덮어써진 채 그대로 올라갈 수 있었다)
        if: ${{ inputs.limit == '' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어 커밋하지 않습니다."
          else
            git commit -m "데이터 갱신 $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: 시험 실행 안내
        if: ${{ inputs.limit != '' }}
        run: echo "::notice::--limit ${{ inputs.limit }} 로 돈 시험 실행이라 커밋하지 않았습니다."

  # 수집이 끝나면 바로 사이트를 다시 올린다.
  # (Actions 가 만든 커밋은 다른 워크플로를 자동으로 깨우지 않기 때문에 여기서 직접 부른다)
  deploy:
    needs: collect
    if: ${{ inputs.limit == '' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
