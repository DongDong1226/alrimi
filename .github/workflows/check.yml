# GitHub 서버(Azure)에서 어디까지 닿는지 한 번에 확인한다.
#
# ── 지금까지 밝혀진 것 (2026-08-05 ~ 08-06) ────────────────────
#   "EIASS 가 해외 IP 를 막는다" 는 사실이 아니었다.
#     - 전 세계 20개 노드 중 17곳 정상 (미국 LA 0.49초, 댈러스 1.09초,
#       독일·프랑스·네덜란드·러시아·인도·베트남 전부 HTTP 200)
#   그런데 GitHub 러너에서는 두 번 다 실패했고, 두 IP 모두 Azure 였다.
#     1차: 52.159.244.171 (San Jose) — DNS 실패 (간헐적 SERVFAIL)
#     2차: 9.234.149.180  (Boydton)  — DNS 성공, TCP443 20초 침묵
#   TCP 가 조용히 시간만 흐르는 것은 방화벽이 패킷을 버릴 때의 모양이다.
#
# ── 이 파일이 답하려는 질문 ────────────────────────────────────
#   Azure 에서 (가) EIASS 만 막히나  (나) 한국 사이트 전체가 막히나
#   - 구글만 되고 한국이 전부 안 되면  -> Azure~한국 경로 문제
#   - 한국 사이트는 되는데 EIASS 만 안 되면 -> EIASS 가 Azure 를 막는 것
#   - VWorld 가 되는지도 같이 본다 (수집에 반드시 필요하다)
#
# ── 안전장치 ───────────────────────────────────────────────────
#   저장소를 내려받지 않는다 / data 를 읽지도 쓰지도 않는다 /
#   커밋·푸시하지 않는다 / Anthropic API 를 부르지 않는다 (비용 0원)
#   각 대상마다 8초만 기다리므로 1분 안에 끝난다.
#
# 쓰는 법: Actions 탭 → 이 워크플로 선택 → Run workflow

name: EIASS 연결 확인 (시험용)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: requests 설치
        run: pip install requests

      - name: 어디까지 닿는지 한 번에 확인
        run: |
          python - <<'PY'
          import socket, ssl, sys, time
          import requests

          OUT = []

          def note(s):
              print(s)
              OUT.append(s)

          # 0) 이 러너가 어디인지
          try:
              d = requests.get("https://ipinfo.io/json", timeout=10).json()
              note(f"러너 IP={d.get('ip')} {d.get('country')}/{d.get('city')} {d.get('org')}")
          except Exception as e:
              note(f"러너 위치 확인 실패 {e}")

          print()
          print("=" * 66)
          print("대상별 TCP 443 연결 시험 (각 8초까지만 기다린다)")
          print("=" * 66)

          # (이름, 호스트, 왜 보는가)
          TARGETS = [
              ("EIASS",        "www.eiass.go.kr", "수집 대상"),
              ("VWorld",       "api.vworld.kr",   "지도·좌표. 수집에 필요"),
              ("환경부",        "www.me.go.kr",    "다른 정부 사이트"),
              ("공공데이터포털",  "www.data.go.kr",  "다른 정부 사이트"),
              ("네이버",        "www.naver.com",   "일반 한국 사이트"),
              ("구글",          "www.google.com",  "대조군(러너 인터넷 정상 확인)"),
          ]

          results = {}
          for label, host, why in TARGETS:
              line = f"{label}({host})"
              # DNS
              t = time.time()
              try:
                  ip = socket.gethostbyname(host)
                  dns = f"DNS={ip} {time.time()-t:.1f}s"
              except Exception as e:
                  note(f"  {line:<34} DNS실패 {type(e).__name__} — {why}")
                  results[label] = "DNS실패"
                  continue
              # TCP
              t = time.time()
              try:
                  s = socket.create_connection((ip, 443), timeout=8)
                  s.close()
                  took = time.time() - t
                  note(f"  {line:<34} 성공 ({took:.2f}s) {dns} — {why}")
                  results[label] = "성공"
              except socket.timeout:
                  note(f"  {line:<34} 시간초과({time.time()-t:.1f}s) 침묵=차단신호 {dns} — {why}")
                  results[label] = "시간초과"
              except Exception as e:
                  note(f"  {line:<34} 실패 {type(e).__name__} {dns} — {why}")
                  results[label] = f"실패({type(e).__name__})"

          # 판정
          print()
          print("=" * 66)
          print("판정")
          print("=" * 66)
          kr_others = [results.get(k) for k in ("환경부", "공공데이터포털", "네이버")]
          kr_ok = sum(1 for v in kr_others if v == "성공")
          eiass_ok = results.get("EIASS") == "성공"
          vworld_ok = results.get("VWorld") == "성공"
          google_ok = results.get("구글") == "성공"

          if not google_ok:
              verdict = "러너의 인터넷 자체가 이상하다. 시험을 다시 해야 한다."
          elif eiass_ok:
              verdict = "EIASS 에 닿았다. 막히지 않았다."
          elif kr_ok == 0:
              verdict = ("한국 사이트가 전부 안 된다 -> EIASS 가 콕 집어 막는 것이 아니라 "
                         "Azure~한국 경로 문제다.")
          else:
              verdict = (f"한국 사이트는 {kr_ok}/3 되는데 EIASS 만 안 된다 "
                         f"-> EIASS 가 Azure 대역을 막는 것이 맞다.")

          note("판정: " + verdict)
          note(f"VWorld(수집에 필요): {'된다' if vworld_ok else '안 된다'}")
          print()
          print(verdict)

          print("::notice::[결과] " + " || ".join(OUT)[:2800])
          # 이 워크플로는 '조사'가 목적이므로 실패로 끝내지 않는다.
          sys.exit(0)
          PY
