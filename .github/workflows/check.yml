# EIASS 가 GitHub 서버를 막는지 확인만 하는 시험용 워크플로.
#
# 왜 만들었나:
#   2026-08-01 에 collect.yml 을 한 번 돌렸다가 실패한 것을 근거로
#   "EIASS 가 해외 IP 를 막는다" 고 결론 내렸는데, 2026-08-05 에 다시 확인해 보니
#   미국(LA 0.49초·댈러스 1.09초)·독일·프랑스·네덜란드 등 20개 노드 중 17곳에서
#   EIASS 가 정상 응답(HTTP 200)했다. 즉 "해외 IP 차단" 은 사실이 아니다.
#   남은 가능성은 "GitHub 러너(Azure) 대역만 막혔나" 하나뿐이라 그것만 확인한다.
#
# 이 파일이 하지 않는 것 (안전장치):
#   - 저장소를 내려받지 않는다 (checkout 없음)
#   - data/projects.json 을 읽지도 쓰지도 않는다
#   - 커밋·푸시하지 않는다
#   - Anthropic API 를 부르지 않는다 (비용 0원)
#   오직 "닿느냐 안 닿느냐" 만 본다.
#
# 쓰는 법:
#   GitHub 저장소 → Actions 탭 → 왼쪽에서 이 워크플로 선택 → Run workflow 버튼
#   30초쯤 뒤 로그에 결과가 한국어로 찍힌다.

name: EIASS 연결 확인 (시험용)

on:
  workflow_dispatch:

# 아무것도 고치지 않으므로 읽기 권한만 준다.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: requests 설치
        run: pip install requests

      # EIASS 가 본 우리 주소가 무엇인지 남겨 둔다.
      # 나중에 "그 IP 가 막힌 거였다" 를 따질 때 근거가 된다.
      - name: 이 서버가 어디에 있는지 확인
        run: |
          python - <<'PY'
          import requests
          try:
              d = requests.get("https://ipinfo.io/json", timeout=15).json()
              print("이 GitHub 러너의 위치")
              print(f"  공인 IP : {d.get('ip')}")
              print(f"  나라/도시: {d.get('country')} / {d.get('city')}")
              print(f"  통신사   : {d.get('org')}")
          except Exception as e:
              print(f"위치 확인 실패(중요하지 않음): {e}")
          PY

      - name: EIASS 에 닿는지 확인
        run: |
          python - <<'PY'
          import socket, sys, time
          import requests

          HOST = "www.eiass.go.kr"
          ok = True

          print("=" * 62)
          print("1단계 — 주소록(DNS) 에서 EIASS 의 IP 를 찾을 수 있나")
          print("=" * 62)
          try:
              ip = socket.gethostbyname(HOST)
              print(f"  성공: {HOST} -> {ip}")
          except Exception as e:
              print(f"  실패: 주소를 못 찾습니다 ({e})")
              print("  -> 인터넷 설정 문제입니다. EIASS 차단과는 다른 얘기입니다.")
              sys.exit(1)

          print()
          print("=" * 62)
          print("2단계 — 그 IP 의 443 번 문을 두드리면 열리나 (TCP 연결)")
          print("=" * 62)
          t = time.time()
          try:
              s = socket.create_connection((HOST, 443), timeout=20)
              s.close()
              print(f"  성공: {time.time() - t:.2f}초 만에 연결됐습니다.")
              print("  -> IP 차단이 아닙니다. 차단이면 여기서 조용히 시간만 흐릅니다.")
          except socket.timeout:
              print(f"  실패: {time.time() - t:.2f}초 동안 아무 대답이 없습니다.")
              print("  -> 방화벽이 이 서버의 IP 를 버리고 있을 가능성이 큽니다.")
              print("     (거부당하면 '거절' 이 즉시 오는데, 조용한 것은 차단의 특징입니다)")
              ok = False
          except Exception as e:
              print(f"  실패: {type(e).__name__}: {e}")
              ok = False

          if not ok:
              print()
              print("=" * 62)
              print("결론: GitHub 서버에서는 EIASS 에 닿지 못합니다.")
              print("      이 로그의 '공인 IP' 를 근거로 남겨 두세요.")
              print("=" * 62)
              sys.exit(1)

          print()
          print("=" * 62)
          print("3단계 — 실제로 쓰는 목록 API 가 자료를 주나")
          print("=" * 62)
          try:
              r = requests.post(
                  f"https://{HOST}/searchApi/search.do",
                  data={"query": "", "collection": "draft",
                        "urlString": "&alias=1&orgnCd=&sido=",
                        "viewName": "eiass/user/partcptn/choan/choanSperssList_searchApi",
                        "currentPage": 1},
                  headers={"User-Agent": "Mozilla/5.0"}, timeout=20)
              print(f"  HTTP {r.status_code}, 받은 자료 {len(r.content):,}바이트")
              if r.status_code == 403:
                  print("  실패: 403 — 서버가 우리를 알아보고 거부했습니다.")
                  ok = False
              elif r.status_code != 200:
                  print(f"  실패: 예상 못 한 상태코드 {r.status_code}")
                  ok = False
              elif "tbl01" not in r.text:
                  print("  경고: 응답은 왔는데 사업 목록 표가 없습니다.")
                  print("        EIASS 화면이 개편됐을 수 있습니다(차단과는 다른 문제).")
                  print("  응답 앞부분:", r.text[:200].replace("\n", " "))
                  ok = False
              else:
                  print("  성공: 사업 목록을 정상으로 받아왔습니다.")
          except requests.exceptions.ConnectTimeout:
              print("  실패: 연결 시간 초과")
              ok = False
          except Exception as e:
              print(f"  실패: {type(e).__name__}: {e}")
              ok = False

          print()
          print("=" * 62)
          if ok:
              print("결론: 막히지 않았습니다.")
              print("      GitHub Actions 로 자동 수집을 할 수 있습니다.")
              print("      collect.yml 의 schedule 주석을 풀면 됩니다.")
              print("      (AWS 등 별도 서버가 필요 없다는 뜻이기도 합니다)")
          else:
              print("결론: 연결은 되는데 자료를 못 받았습니다. 위 내용을 보고 판단하세요.")
          print("=" * 62)
          sys.exit(0 if ok else 1)
          PY
