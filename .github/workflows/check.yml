# EIASS 로 가는 길이 살아 있는지 확인한다. **자료는 건드리지 않는다.**
#
# 언제 쓰나
#   - 자동 수집이 실패했는데 원인이 '길'인지 '수집기'인지 가르고 싶을 때
#   - Supabase 중계를 새로 배포했거나 키를 바꾼 뒤 확인할 때
#   - EIASS 인증서가 갱신된 뒤(2027-03-29 예정) 중계가 아직 통하는지 볼 때
#
# 실행: GitHub 저장소 → Actions → 이 워크플로 → Run workflow
# 결과: 로그를 못 보는 사람도 알 수 있게 [판정] 주석으로 내보낸다.
#
# ── 2026-08-09: WARP 시험을 걷어내고 서울 중계 시험으로 바꿨다 ──────
# WARP 터널 방식은 자동 수집 3회 연속 실패로 탈락했고, 그때 VWorld 까지
# 같이 실패해서 러너 네트워크를 망가뜨린 것으로 의심된다. 되살리지 말 것.
# 자세한 경위는 docs/HISTORY.md §4.

name: EIASS 연결 확인 (시험용)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 이 러너가 어디인지
        run: |
          D=$(curl -s --max-time 15 https://ipinfo.io/json || echo '{}')
          IP=$(echo "$D"  | python3 -c "import sys,json;print(json.load(sys.stdin).get('ip',''))" 2>/dev/null)
          LOC=$(echo "$D" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('country',''),'/',d.get('city',''),d.get('org',''))" 2>/dev/null)
          echo "::notice::[러너위치] IP=${IP} ${LOC}"

      # 1차 — 예전 방식. 되면 좋지만 6번 중 1번만 됐다(2026-08-06 실측).
      - name: 1차 — GitHub 에서 EIASS 로 직접
        id: direct
        run: |
          T0=$(date +%s%3N)
          # 실패해도 -w 가 '000' 을 찍어 주므로 || echo 를 덧붙이면 000000 이 된다 (겪음)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://www.eiass.go.kr/ || true)
          MS=$(( $(date +%s%3N) - T0 ))
          echo "직접 연결: HTTP ${CODE} (${MS}ms)"
          if [ "$CODE" = "200" ]; then
            echo "::notice::[1차·직접] 성공 HTTP ${CODE} (${MS}ms)"
          else
            echo "::notice::[1차·직접] 실패 HTTP ${CODE} (${MS}ms) — 예상된 결과입니다"
          fi

      # 2차 — 지금 실제로 쓰는 길. 이게 성공해야 자동 수집이 돈다.
      - name: 2차 — 서울 중계를 거쳐 EIASS 로
        env:
          EIASS_RELAY_URL: ${{ secrets.EIASS_RELAY_URL }}
          EIASS_RELAY_KEY: ${{ secrets.EIASS_RELAY_KEY }}
        run: |
          if [ -z "$EIASS_RELAY_URL" ] || [ -z "$EIASS_RELAY_KEY" ]; then
            echo "::error::[2차·중계] EIASS_RELAY_URL / EIASS_RELAY_KEY Secret 이 없습니다. docs/SETUP.md 참고"
            exit 1
          fi
          FORM='query=&collection=draft&urlString=%26alias%3D1%26orgnCd%3D%26sido%3D&viewName=eiass/user/partcptn/choan/choanSperssList_searchApi&currentPage=1&sort=DRFOP_TMDT_START_DT/DESC,BIZ_SEQ/DESC'
          T0=$(date +%s%3N)
          OUT=$(curl -s -o body.bin -D head.txt -w '%{http_code}' --max-time 90 -X POST "$EIASS_RELAY_URL" -H "x-relay-key: $EIASS_RELAY_KEY" -H "x-relay-url: https://www.eiass.go.kr/searchApi/search.do" -H "x-relay-method: POST" -H "x-region: ap-northeast-2" -H "content-type: application/x-www-form-urlencoded" --data "$FORM")
          MS=$(( $(date +%s%3N) - T0 ))
          UP=$(grep -i '^x-upstream-status' head.txt | tr -d '\015' | awk '{print $2}')
          REGION=$(grep -i '^x-sb-edge-region' head.txt | tr -d '\015' | awk '{print $2}')
          SIZE=$(wc -c < body.bin)
          echo "중계 ${OUT} / EIASS ${UP} / ${SIZE} bytes / 지역 ${REGION} / ${MS}ms"
          # 중계가 거절했으면 까닭이 본문에 한글로 들어 있다 (헤더에는 짧은 코드만)
          if [ "$OUT" != "200" ]; then
            echo "중계가 거절한 까닭:"; head -c 400 body.bin; echo
          fi
          # 지역이 서울이 아니면 중계를 거치는 뜻이 없다 (기본값은 '부르는 사람과 가까운 곳')
          if [ "$OUT" = "200" ] && [ "$UP" = "200" ] && [ "$SIZE" -gt 1000 ] && [ "$REGION" = "ap-northeast-2" ]; then
            echo "::notice::[2차·중계] 성공 — 지역 ${REGION}, 목록 ${SIZE} bytes, ${MS}ms"
            echo "::notice::[판정] 서울 중계로 EIASS 수집이 가능합니다"
          else
            echo "::error::[2차·중계] 실패 (중계 ${OUT} / EIASS ${UP} / 지역 ${REGION} / ${SIZE} bytes)"
            echo "::error::[판정] 중계가 통하지 않습니다. 확인 순서: ① Supabase 함수가 살아 있나 ② RELAY_KEY 가 양쪽에 같나 ③ 프로젝트 지역이 서울인가 ④ EIASS 인증서가 바뀌지 않았나(tools/relay/index.ts 맨 위 주석)"
            exit 1
          fi
          rm -f body.bin head.txt

      # ── VWorld 지오코딩 ──────────────────────────────────────────────
      # 2026-08-15 부터 VWorld 도 서울 중계를 탄다.
      #   GitHub 러너에서 VWorld 가 **아예 답을 하지 않았다**(502 / 연결 끊김).
      #   틀린 키도 똑같이 끊겼으니 키 문제가 아니었다 — EIASS 와 같은 모양.
      #   그래서 **직접 접속이 실패하는 것은 이제 정상이고**, 봐야 할 것은 중계 쪽이다.
      #
      # ★ HTTP 상태만 보면 안 된다. VWorld 는 키를 거부할 때도 HTTP 200 에
      #   {"response":{"status":"ERROR"}} 를 담아 준다. 반드시 status 를 읽는다.
      - name: VWorld 지오코딩 (직접 / 중계)
        if: always()
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          EIASS_RELAY_URL: ${{ secrets.EIASS_RELAY_URL }}
          EIASS_RELAY_KEY: ${{ secrets.EIASS_RELAY_KEY }}
        run: |
          if [ -z "$VWORLD_KEY" ]; then
            echo "::error::[VWorld] VWORLD_KEY Secret 이 없습니다"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          key = (os.environ.get("VWORLD_KEY") or "").strip()
          relay = (os.environ.get("EIASS_RELAY_URL") or "").strip()
          rkey = (os.environ.get("EIASS_RELAY_KEY") or "").strip()

          TARGET = "https://api.vworld.kr/req/address?" + urllib.parse.urlencode({
              "service": "address", "request": "getcoord", "version": "2.0",
              "crs": "epsg:4326", "type": "parcel", "format": "json",
              "address": "경기도 군포시 당정동", "key": key})

          def read(raw):
              """VWorld 응답 본문에서 (성공여부, 설명) 을 뽑는다."""
              try:
                  res = (json.loads(raw).get("response") or {})
              except Exception:
                  return False, f"JSON 이 아님 — {raw[:60]}"
              st = res.get("status")
              pt = (res.get("result") or {}).get("point")
              err = (res.get("error") or {})
              if st == "OK" and pt:
                  return True, f"OK 좌표 {pt.get('y')},{pt.get('x')}"
              return False, f"status={st} {err.get('text') or err.get('level') or ''}"

          # ① 직접 — 이제는 실패해도 정상이다
          try:
              with urllib.request.urlopen(TARGET, timeout=20) as r:
                  ok_direct, msg = read(r.read().decode("utf-8", "replace"))
          except Exception as e:
              ok_direct, msg = False, f"연결 실패 {type(e).__name__} {str(e)[:50]}"
          print(f"  직접: {msg}")
          print(f"::notice::[VWorld·직접] {msg}"
                + ("" if ok_direct else " — 실패해도 정상입니다(중계를 쓰므로)"))

          # ② 중계 경유 — 이게 실제로 쓰는 길이다
          if not relay or not rkey:
              print("::error::[VWorld·중계] 중계 Secret 이 없어 시험하지 못했습니다")
              raise SystemExit(0)
          req = urllib.request.Request(relay, data=b"", method="POST", headers={
              "x-relay-key": rkey,
              "x-relay-url": TARGET,
              "x-relay-method": "GET",
              "x-region": "ap-northeast-2",
          })
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = r.read().decode("utf-8", "replace")
                  up = r.headers.get("x-upstream-status")
                  region = r.headers.get("x-sb-edge-region")
              if up is None:
                  ok_relay, msg2 = False, f"중계가 거절 — {body[:120]}"
              else:
                  ok_relay, msg2 = read(body)
                  msg2 = f"{msg2} (VWorld 쪽 HTTP {up}, 지역 {region})"
          except Exception as e:
              ok_relay, msg2 = False, f"중계 호출 실패 {type(e).__name__} {str(e)[:60]}"
              region = None
          print(f"  중계: {msg2}")
          print(f"::notice::[VWorld·중계] {msg2}")

          if ok_relay and region == "ap-northeast-2":
              print("::notice::[판정] VWorld 지오코딩이 서울 중계로 됩니다 — 새 사업 좌표가 채워집니다")
          elif ok_relay:
              print(f"::error::[판정] 되긴 하는데 서울이 아닙니다(지역 {region}). "
                    "x-region 헤더가 먹지 않으면 미국에서 도는 것이라 곧 다시 막힙니다")
          else:
              print("::error::[판정] VWorld 지오코딩이 중계로도 안 됩니다. "
                    "확인 순서: ① 중계 함수에 api.vworld.kr 이 허용 목록에 있나 "
                    "(tools/relay/index.ts 의 ALLOW_PREFIXES — 함수를 다시 배포했나) "
                    "② VWORLD_KEY 가 맞나")
          PY
